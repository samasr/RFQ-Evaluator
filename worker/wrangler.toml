name = "rfq-evaluator-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Secrets — set each with `npx wrangler secret put <NAME>`; never commit them:
#   ANTHROPIC_API_KEY          (AI proxy)
#   SUPABASE_URL               (billing — e.g. https://<ref>.supabase.co)
#   SUPABASE_ANON_KEY          (billing — verifies the caller's JWT)
#   SUPABASE_SERVICE_ROLE_KEY  (billing — applies the plan upgrade, bypasses RLS)
#   STRIPE_SECRET_KEY          (billing — sk_test_… / sk_live_…)
#   MOYASAR_SECRET_KEY         (billing — sk_test_… / sk_live_…)

[vars]
# Comma-separated list of origins allowed to call this proxy.
ALLOWED_ORIGINS = "https://rfqranker.com,https://www.rfqranker.com,https://samasr.github.io,http://localhost:5173,http://localhost:5174"

# Public site URL — used to build Stripe/Moyasar return URLs. Not secret.
APP_URL = "https://rfqranker.com"

# Request caps so a scripted client or runaway loop can't run up the Anthropic
# bill. Limits are enforced per Cloudflare location, not globally. namespace_id
# is any unique-per-account id; period must be 10 or 60 (seconds).
#   RL_IP     — per client IP (CF-Connecting-IP)
#   RL_GLOBAL — whole-worker circuit breaker (single "all" key)
[[ratelimits]]
name = "RL_IP"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_GLOBAL"
namespace_id = "1002"
simple = { limit = 600, period = 60 }
