name = "rfq-evaluator-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# ANTHROPIC_API_KEY is a secret — set it with:
#   npx wrangler secret put ANTHROPIC_API_KEY
# Never put it here; this file is committed to git.

[vars]
# Comma-separated list of origins allowed to call this proxy.
ALLOWED_ORIGINS = "https://rfqranker.com,https://www.rfqranker.com,https://samasr.github.io,http://localhost:5173,http://localhost:5174"

# Request caps so a scripted client or runaway loop can't run up the Anthropic
# bill. Limits are enforced per Cloudflare location, not globally. namespace_id
# is any unique-per-account id; period must be 10 or 60 (seconds).
#   RL_IP     — per client IP (CF-Connecting-IP)
#   RL_GLOBAL — whole-worker circuit breaker (single "all" key)
[[ratelimits]]
name = "RL_IP"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "RL_GLOBAL"
namespace_id = "1002"
simple = { limit = 600, period = 60 }
